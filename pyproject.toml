[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "medvol"
dynamic = ["version"]
description = "Faithful N:N conversion of medical image formats through the MLArray v1 model."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Karol Gotkowski", email = "karol.gotkowski@dkfz.de" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=2",
  "mlarray>=1.0.0",
  "nibabel>=5.2",
  "pynrrd>=1.0,<2",
]

[project.optional-dependencies]
dicom = ["pydicom>=3.0", "highdicom>=0.28"]
dev = ["pytest>=7", "pydicom>=3.0", "highdicom>=0.28"]

[project.scripts]
medvol = "medvol.cli:main"

[project.entry-points."medvol.formats"]
mla = "medvol.plugins.mla:MlaPlugin"
nifti = "medvol.plugins.nifti:NiftiPlugin"
dicom = "medvol.plugins.dicom:DicomPlugin"
mgh = "medvol.plugins.mgh:MghPlugin"
metaimage = "medvol.plugins.metaimage:MetaImagePlugin"
nrrd = "medvol.plugins.nrrd:NrrdPlugin"

[project.urls]
Homepage = "https://github.com/MIC-DKFZ/MedVol"

[tool.setuptools.dynamic]
version = { attr = "medvol.__version__" }

[tool.setuptools.packages.find]
include = ["medvol*"]
